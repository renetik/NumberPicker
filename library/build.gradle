apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group = providers.gradleProperty('group').getOrElse('com.github.renetik')
version = providers.gradleProperty('version').getOrElse('LOCAL')

android {
    namespace = 'com.shawnlin.numberpicker'
    compileSdk = 37
    defaultConfig {
        minSdk = 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'NumberPicker'
                pom {
                    name = 'NumberPicker'
                    description = 'Renetik fork of ShawnLin013/NumberPicker.'
                    url = 'https://github.com/renetik/NumberPicker'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/renetik/NumberPicker/blob/master/LICENSE'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/renetik/NumberPicker.git'
                        url = 'https://github.com/renetik/NumberPicker'
                    }
                }
            }
        }
    }
}
